syntax = "proto3";

package users.v1;
option go_package = "wch/gen/users/v1;userspb";

import "google/protobuf/timestamp.proto";

message User {
	string id = 1;
	string username = 2;
	string email = 3;
	string password_hash = 4;
	string first_name = 5;
	string last_name = 6;
	string surname = 7;
	string avatar_url = 8;
	string status = 9;
	int32 department_id = 10;
	google.protobuf.Timestamp created_at = 12;
	google.protobuf.Timestamp updated_at = 13; 
}

message UserSummary {
	string id = 1;
	string name = 2;
	string email = 3;
}

message Avatar {
	bytes data = 1;
	string mime_type = 2;
	string owner_id = 3;
}

service UsersService {
	rpc CreateUser(CreateUserRequest) returns (UserResponse);

	rpc GetUserByID(GetUserByIDRequest) returns (GetUserResponse);
	rpc GetUsersByIDs(GetUsersByIDsRequest) returns (ListUsersResponse);
	rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserResponse);
	
	rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
	
	rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
	rpc DeleteUser(DeleteUserRequest) returns (UserResponse);
	rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

	rpc GetAvatarForUser(GetAvatarRequest) returns (AvatarResponse);
	rpc GetAvatarsForUsers(GetAvatarsForUsersRequest) returns (GetAvatarsForUsersResponse);
	rpc GetAvatarsForChats(GetAvatarsForChatsRequest) returns (GetAvatarsForChatsResponse);
	rpc UpdateAvatarForChat(UpdateAvatarForChatRequest) returns (UpdateAvatarResponse);
}

message CreateUserRequest {
	User user = 1;
}

message GetUserByIDRequest {
	string user_id = 1;
}

message GetUsersByIDsRequest {
	repeated string id = 1;
}

message GetUserByEmailRequest {
	string email = 1;
}

message GetUserResponse {
	User user = 1;
}

message UpdateUserRequest {
	User user = 1;
	Avatar avatar = 2;
}

message DeleteUserRequest {
	string user_id = 1;
}

message UserResponse {

}

message ListUsersRequest {

}

message ListUsersResponse {
	repeated User users = 1;
}

message SearchUsersRequest {
    string username = 1;     // optional
    string email = 2;        // optional
    string first_name = 3;   // optional
    string last_name = 4;    // optional
	string surname = 5;			// optional
    int32 department_id = 6;// optional
}

message SearchUsersResponse {
	repeated UserSummary users = 1;
}

message GetAvatarRequest {
	string user_id = 1;
}

message AvatarResponse {
	string user_id = 1;
	Avatar avatar = 2;
}

message GetAvatarsForChatsRequest {
	repeated string ids = 1;
}

message GetAvatarsForChatsResponse {
	repeated Avatar avatars = 1;
}

message UpdateAvatarForChatRequest {
	string chat_id = 1;
	bytes avatar = 2;
}

message UpdateAvatarResponse {
	Avatar avatar = 1;
	string key = 2;
}

message GetAvatarsForUsersRequest {
	repeated string ids = 1;
}

message GetAvatarsForUsersResponse {
	repeated Avatar avatars = 1;
}